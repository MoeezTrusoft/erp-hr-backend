# Nextcloud FPM webroot rules; TLS terminates at the ERP proxy.
user www-data;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log /dev/stdout;
 sendfile on;
 server_tokens off;
 map $arg_v $asset_immutable { "" ""; default ", immutable"; }
 server {
  listen 8080;
  server_name _;
  root /var/www/html;
  index index.php index.html /index.php$request_uri;
  client_max_body_size 128M;
  client_body_timeout 300s;
  fastcgi_buffers 64 4K;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options SAMEORIGIN always;
  location = /robots.txt { allow all; log_not_found off; access_log off; }
  location ^~ /.well-known {
   location = /.well-known/carddav { return 301 /remote.php/dav/; }
   location = /.well-known/caldav { return 301 /remote.php/dav/; }
   return 301 /index.php$request_uri;
  }
  location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) { return 404; }
  location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) { return 404; }
  location ~ \.php(?:$|/) {
   rewrite ^/(?!index|remote|public|cron|core/ajax/update|status|ocs/v[12]|updater/.+|oc[ms]-provider/.+|.+/richdocumentscode(_arm64)?/proxy) /index.php$request_uri;
   fastcgi_split_path_info ^(.+?\.php)(/.*)$;
   set $path_info $fastcgi_path_info;
   try_files $fastcgi_script_name =404;
   include fastcgi_params;
   fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
   fastcgi_param PATH_INFO $path_info;
   fastcgi_param HTTPS on;
   fastcgi_param modHeadersAvailable true;
   fastcgi_param front_controller_active true;
   fastcgi_param HTTP_PROXY "";
   fastcgi_pass 127.0.0.1:9000;
   fastcgi_intercept_errors on;
   fastcgi_request_buffering off;
   fastcgi_read_timeout 300;
  }
  location ~ \.(?:css|js|mjs|svg|gif|png|jpg|ico|wasm|tflite|map|ogg|flac)$ {
   try_files $uri /index.php$request_uri;
   add_header Cache-Control "public, max-age=15778463$asset_immutable";
   access_log off;
   location ~ \.wasm$ { default_type application/wasm; }
  }
  location ~ \.woff2?$ { try_files $uri /index.php$request_uri; expires 7d; access_log off; }
  location /remote { return 301 /remote.php$request_uri; }
  location / { try_files $uri $uri/ /index.php$request_uri; }
 }
}
