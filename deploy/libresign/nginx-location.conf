# Include inside the existing TLS server for erp.trusoft.ai after nginx -t.
location = /libresign { return 308 /libresign/; }
location ^~ /libresign/ {
    proxy_pass http://127.0.0.1:5398/;
    proxy_http_version 1.1;
    proxy_set_header Host erp.trusoft.ai;
    proxy_set_header X-Forwarded-Host erp.trusoft.ai;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 20m;
    add_header Referrer-Policy no-referrer always;
}
