name: Attendance biometric adapters
on:
  pull_request:
    paths: ['biometrics/**', '.github/workflows/attendance-biometrics.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'biometrics/**/requirements.txt'
      - name: Install capture and face runtimes without model weights
        run: python -m pip install -r biometrics/agent/requirements.txt -r biometrics/insightface/requirements.txt
      - name: Check capture and face adapter contracts
        run: python -m unittest discover -s biometrics/tests -v
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: biometrics/sourceafis/pom.xml
      - name: Test real SourceAFIS extraction and package the service
        run: mvn -B -f biometrics/sourceafis/pom.xml package
