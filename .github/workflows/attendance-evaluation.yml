name: Attendance evaluation database safeguards
on:
  pull_request:
    paths: ['prisma/**', 'src/**/attendance*.js', 'src/services/timesheetSubmission.service.js', 'scripts/test-attendance-evaluation-postgres.py', '.github/workflows/attendance-evaluation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: attendance-test
          POSTGRES_DB: hr_attendance_evaluation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate migration, isolation and concurrent period protection
        env:
          ATTENDANCE_TEST_DATABASE_URL: postgresql://postgres:attendance-test@127.0.0.1:5432/hr_attendance_evaluation_test
        run: python scripts/test-attendance-evaluation-postgres.py
