name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: lint, test, image and security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_FETCH_RETRIES: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout shared contracts (read-only deploy key)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MoeezTrusoft/erp-contracts
          ref: ff1a16cd969a78d9acc438c91f171f83c331dca6
          path: _contracts
          ssh-key: ${{ secrets.CONTRACTS_DEPLOY_KEY }}
          persist-credentials: false
      - name: Place contracts beside the service for file dependency
        run: mv _contracts ../contracts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Foundation and architecture gate
        env:
          GATE_LOG_DIR: ${{ runner.temp }}/gate-logs
        run: npm run gate:p1
      - name: Production image
        run: docker build --build-context contracts=../contracts -t ci-validate:${{ github.sha }} .
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ci-validate:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Retain gate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-diagnostics
          path: ${{ runner.temp }}/gate-logs
          retention-days: 7
  secrets:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan changed commits with the open-source CLI
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          range="$HEAD_SHA"
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            range="$BASE_SHA..$HEAD_SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$range" .
  ai-review:
    if: github.event_name == 'pull_request'
    name: AI review (DeepSeek)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/ai-review
        with:
          api-key: ${{ secrets.AI_REVIEW_API_KEY }}
          base-url: ${{ vars.AI_REVIEW_BASE_URL || 'https://api.deepseek.com/v1' }}
          model: ${{ vars.AI_REVIEW_MODEL || 'deepseek-chat' }}
          blocking: ${{ vars.AI_REVIEW_BLOCKING || 'false' }}
