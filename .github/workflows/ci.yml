name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    name: lint, test, image and security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout shared contracts (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: MoeezTrusoft/erp-contracts
          ref: c3c741315cadb44393cdf03404b3ffe1c33cea9a # contracts 0.19.0 appraisal candidate (erp-contracts PR #19)
          path: _contracts
          ssh-key: ${{ secrets.CONTRACTS_DEPLOY_KEY }}
          persist-credentials: false
      - name: Place contracts beside the service for file dependency
        run: mv _contracts ../contracts
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - run: node --test tests/security/dependency-patches.test.mjs
      - name: Foundation and architecture gate
        run: npm run gate:p1
      - name: Production image
        run: docker build --build-context contracts=../contracts -t ci-validate:${{ github.sha }} .
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ci-validate:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
  hr-compatibility:
    name: full HR migration and integration compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: appraisal_admin
          POSTGRES_DB: hr_appraisal_release_00000000000000000000000000000001
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:55443:5432"]
        options: --health-cmd "pg_isready -U appraisal_admin" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TZ: UTC
      DATABASE_URL: postgresql://appraisal_admin@127.0.0.1:55443/hr_appraisal_release_00000000000000000000000000000001
      DATABASE_DIRECT_URL: postgresql://appraisal_admin@127.0.0.1:55443/hr_appraisal_release_00000000000000000000000000000001
      HR_REQUIRE_DB_TESTS: '1'
      # Public, synthetic test keys. This isolated database contains no personnel data.
      HR_C4_ENCRYPTION_KEY: RpGAX25dxV8Prwx61cTjO3Z48ESk+0qap3sXYRB5lIs=
      HR_C4_BLIND_INDEX_KEY: 5VAHsWnr6plLECxn2g3sJZpnryiODjPshS9/w+/T3Zc=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MoeezTrusoft/erp-contracts
          ref: c3c741315cadb44393cdf03404b3ffe1c33cea9a
          path: _contracts
          ssh-key: ${{ secrets.CONTRACTS_DEPLOY_KEY }}
          persist-credentials: false
      - run: mv _contracts ../contracts
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx --no-install prisma generate
      - name: Prepare historical migration grantees in the disposable database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE erp NOLOGIN NOSUPERUSER NOBYPASSRLS; CREATE ROLE hr_app LOGIN NOSUPERUSER NOBYPASSRLS;'
      - run: npx --no-install prisma migrate deploy
      - run: npm run db:indexes:deploy
      - name: Grant the test role ordinary access so FORCE RLS is exercised
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'GRANT USAGE ON SCHEMA public TO hr_app; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO hr_app; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO hr_app;'
      - run: npm test -- --maxWorkers=2 --workerIdleMemoryLimit=512MB --testTimeout=30000
  appraisals:
    name: appraisal PostgreSQL and Redis recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: appraisal_admin
          POSTGRES_DB: performance_appraisals_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:55443:5432"]
        options: --health-cmd "pg_isready -U appraisal_admin -d performance_appraisals_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["127.0.0.1:56379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TZ: UTC
      DATABASE_URL: postgresql://appraisal_runtime@127.0.0.1:55443/performance_appraisals_test
      APPRAISAL_TEST_REDIS_URL: redis://127.0.0.1:56379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: MoeezTrusoft/erp-contracts
          ref: c3c741315cadb44393cdf03404b3ffe1c33cea9a
          path: _contracts
          ssh-key: ${{ secrets.CONTRACTS_DEPLOY_KEY }}
          persist-credentials: false
      - run: mv _contracts ../contracts
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx --no-install prisma generate
      - run: node tests/appraisals/prepare.mjs
      - run: npm run test:appraisals
      - run: node --test tests/appraisals/worker-recovery.mjs
  secrets:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan changed commits with the open-source CLI
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          range="$HEAD_SHA"
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            range="$BASE_SHA..$HEAD_SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$range" .
  ai-review:
    if: github.event_name == 'pull_request'
    name: AI review (DeepSeek)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ai-review
        with:
          api-key: ${{ secrets.AI_REVIEW_API_KEY }}
          base-url: ${{ vars.AI_REVIEW_BASE_URL || 'https://api.deepseek.com/v1' }}
          model: ${{ vars.AI_REVIEW_MODEL || 'deepseek-chat' }}
          blocking: ${{ vars.AI_REVIEW_BLOCKING || 'false' }}
