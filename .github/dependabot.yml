version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Asia/Karachi
  open-pull-requests-limit: 5
  groups:
    compatible-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Asia/Karachi
  open-pull-requests-limit: 5
  groups:
    compatible-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Asia/Karachi
  open-pull-requests-limit: 5
  groups:
    compatible-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
